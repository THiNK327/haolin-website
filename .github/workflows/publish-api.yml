name: Publish playground API
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-playground-api
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Test authentication, quotas, computation, and persistence
        run: |
          pip install -r server/requirements.txt
          python -m unittest server.test_api server.test_state_store server.test_azure_api -v
      - name: Test Azure storage protocol with Azurite
        run: |
          npm install --prefix "$RUNNER_TEMP/azurite" azurite@3.35.0
          AZURITE_BIN="$RUNNER_TEMP/azurite/node_modules/.bin/azurite-blob" python -m unittest server.test_azurite -v
      - name: Set image name
        run: echo "API_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/haolin-playground-api" >> "$GITHUB_ENV"
      - name: Build container
        run: docker build -f server/Dockerfile -t "$API_IMAGE:$GITHUB_SHA" .
      - name: Smoke test actual container
        run: |
          docker run -d --name api-smoke --memory=2g --cpus=1 -p 127.0.0.1:8000:8000 -e CRASDI_API_KEY="$(openssl rand -hex 32)" -e AUTH_SECRET="$(openssl rand -hex 32)" "$API_IMAGE:$GITHUB_SHA"
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/session)" = 401
          docker rm -f api-smoke
      - name: Log in and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          docker push "$API_IMAGE:$GITHUB_SHA"
          docker tag "$API_IMAGE:$GITHUB_SHA" "$API_IMAGE:latest"
          docker push "$API_IMAGE:latest"
          echo "Published: \`$API_IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'First publication: set the GitHub package visibility to Public before anonymous Azure pulls.' >> "$GITHUB_STEP_SUMMARY"
