# Temporary asset-preparation job. Remove before merging the website update.
name: Prepare CV v6 download
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: prepare-cv-v6-assets
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'cv-v6-research-links'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF export dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install weasyprint==68.0 PyMuPDF==1.26.5
      - name: Complete source-based background details
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          marker = '<article className="cv-entry"><h3>Mini Traffic: urban-road simulator</h3>'
          addition = '<article className="cv-entry"><div className="entry-kicker">Tongji University · 2019–2021</div><h3>Undergraduate Researcher</h3><p>I studied nondestructive acoustic-emission crack monitoring for high-speed-railway ballastless track slabs, linking acoustic signatures to finite-element-simulated crack propagation. This work with Dr. Yu Zhou led to two granted CNIPA patents.</p><p>With Dr. Yujie Lu, I investigated a life-cycle maturity model of intelligent construction in urban rail transit through literature review, questionnaires, and hierarchical analysis; the work was recognized as an excellent project.</p></article>\n        '
          if '<h3>Undergraduate Researcher</h3>' not in s:
              assert s.count(marker) == 1
              s = s.replace(marker, addition + marker)
          marker = '<p className="toolkit"><strong>Tools I work with</strong> Python · ArcGIS · SQL · MATLAB · Git/GitHub</p>'
          if '<strong>Languages</strong>' not in s:
              assert s.count(marker) == 1
              s = s.replace(marker, marker + '\n        <p className="toolkit"><strong>Languages</strong> English (fluent) · Mandarin Chinese (native)</p>')
          p.write_text(s)
          PY
      - run: python scripts/export-cv.py
      - name: Render the generated PDF for visual review
        run: |
          mkdir -p /tmp/cv-v6-preview
          python - <<'PY'
          import fitz
          d = fitz.open('public/Haolin_Wang_Academic_CV_v6.pdf')
          assert len(d) == 5
          for i, p in enumerate(d):
              p.get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(f'/tmp/cv-v6-preview/page-{i+1}.png')
          print('Generated five CV page previews for review.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cv-v6-download-review
          path: |
            /tmp/cv-v6-preview/*.png
            public/Haolin_Wang_Academic_CV_v6.pdf
      - name: Commit only the requested CV assets and background text
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/Haolin_Wang_Academic_CV_v6.pdf public/Haolin_Wang_CV.pdf app/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified CV v6 PDF and complete source-based background details'
            git push origin "HEAD:$HEAD_BRANCH"
          fi
